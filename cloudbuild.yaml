steps:
  # Install dependencies
  - name: node:22
    entrypoint: npm
    args: ["ci"]
    dir: "server"

  # Run lint
  - name: node:22
    entrypoint: npm
    args: ["run", "lint"]
    dir: "server"

  # Build TypeScript
  - name: node:22
    entrypoint: npm
    args: ["run", "build"]
    dir: "server"

  # Build Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/multitenant-app/$_SERVICE_NAME:$SHORT_SHA"
      - server/

  # Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/multitenant-app/$_SERVICE_NAME:$SHORT_SHA"

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/multitenant-app/$_SERVICE_NAME:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=300
      - --set-env-vars=NODE_ENV=production
      - --update-secrets=DATABASE_URL=database-url:latest
      - --update-secrets=REDIS_URL=redis-url:latest
      - --update-secrets=JWT_ACCESS_SECRET=jwt-access-secret:latest
      - --update-secrets=JWT_REFRESH_SECRET=jwt-refresh-secret:latest
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:multitenant-db
      - --vpc-connector=multitenant-connector
      - --vpc-egress=private-ranges-only
      - --allow-unauthenticated
      - --ingress=all

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: multitenant-api

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
